tryIt:
  - command: "cat AGENTS.md CLAUDE.md 2>/dev/null"
    note: "The memory nearly every repository with an agent in it already has, and
      the one nobody audits. Read it a line at a time and ask of each: would the
      next session behave differently without this? The lines that fail that
      question are being paid for on every prompt from now on."
  - command: "conductor note \"the thing you just worked out\""
    note: "One fact into the ledger, at the moment of learning rather than at the
      end. A session that is killed takes everything it did not write down with
      it, and the next one gets to rediscover it at full price."
  - command: "conductor bug list"
    note: "What is open, including defects carried forward from earlier runs in the
      same store with the name of the plan that filed each. Run it before
      hunting: the known ones are already here, and re-filing one is how a
      ledger stops being readable."

