tryIt:
  - command: "git log --format='%H %ct %s' | head"
    note: "The cheapest structured event log there is, and you already have it: one
      record per transition, machine-readable fields, appended and never
      rewritten. It is also the limit of what comes free — it can tell you what
      changed and never what it cost, how long anything waited, or whether the
      change was any good."
  - command: "conductor history --json --limit 0"
    note: "Every run this machine has recorded, as data rather than as a screen. The
      store is opened read-only, so this is safe to point at a run that is
      happening right now. Every figure on this site was computed from this."
  - command: "conductor money"
    note: "The cost table: sessions, tokens, cache-read share, spend, checkpoints,
      and the per-checkpoint divisions — plus the cuts a lifetime average hides,
      which are the windows either side of a settings change, the per-stage
      split, and the calendar month."

