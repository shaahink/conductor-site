meta:
  title: "Agent observability"
  description: "An agent shows you almost nothing by default. What to record while
    it runs, and what you have to be able to ask about it once it has stopped."
  ogDescription: "What to record while an agent runs, and what you have to be able
    to ask about it afterwards."
  canonical: "/concepts/agent-observability/"

