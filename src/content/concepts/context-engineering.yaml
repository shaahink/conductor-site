tryIt:
  - command: "cat .conductor/logs/session-003.prompt.md"
    note: "The exact prompt one session was given, byte for byte. Reading one is the
      fastest way to see how much of an agent's budget was spent before it was
      asked to do anything."
  - command: 'conductor note "the constraint that surprised you"'
    note: "One line into the knowledge ledger, which the next session's prompt
      carries near the top. This is the carry-forward move with nothing else in
      the way."
  - command: "conductor doctor"
    note: "Checks the plan's own prose for anything the renderer could not resolve,
      before a run starts rather than at a stage boundary hours into one."

