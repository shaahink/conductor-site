tryIt:
  - command: "git reflog"
    note: "The same move in a tool you already have. Every position HEAD has held,
      appended and never edited, kept outside the working tree — which is why a
      branch you deleted is recoverable and an edit you never committed is not.
      Durability is about what got written down, not about how careful the
      process was."
  - command: "conductor status"
    note: "Where the run thinks it is. The answer is rebuilt from the log rather
      than remembered by a process, so it is the same answer whether the engine
      is running, parked, or was killed an hour ago."
  - command: "conductor resume"
    note: "Continue rather than restart. On a run killed mid-session it picks the
      interrupted agent session back up; on one parked for a person it clears
      the park. Neither replays work that already landed."

