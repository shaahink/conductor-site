meta:
  title: "Durable execution and resumability"
  description: "A long job outlives the process running it. What it takes for
    progress to survive a crash, a throttle or a ceiling — and what resuming
    should cost."
  ogDescription: "Progress that survives the process running it, and why running
    out of room is not the same as failing."
  canonical: "/concepts/durable-execution/"

