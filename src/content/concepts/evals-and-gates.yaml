tryIt:
  - command: "npm test; echo \"exit $?\""
    note: "The entire idea, in your own repository, with nothing installed. Whatever
      that number is, that is what a gate would have decided. If it is zero when
      the suite is empty, the gate you were about to write would have been a
      green light wired to nothing."
  - command: "conductor gate --full"
    note: "Runs the whole battery the way a phase confirmation runs it, rather than
      the fast subset a session gets. The right thing to run before believing a
      stage is finished."
  - command: "conductor doctor"
    note: "Among other things, names any stage that matches none of the configured
      gates. A stage with no battery is a supported choice and an expensive
      accident, and this is the difference between the two."

