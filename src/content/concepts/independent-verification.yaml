tryIt:
  - command: "conductor task --list"
    note: "The board read straight out of the database, where claimed and confirmed
      are different statuses on the same row. Whatever any file says about a
      checkpoint, this is what the run believes."
  - command: "git log --oneline --no-merges"
    note: "The verdict's other input, and the reason it is worth having: commits
      exist whether or not anyone wrote a summary, and they do not improve when
      the summary does."

