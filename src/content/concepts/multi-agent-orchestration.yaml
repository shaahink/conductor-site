meta:
  title: "Multi-agent orchestration"
  description: "Not several models talking to each other, but one agent invoked in
    different roles, sequenced by what just happened, beside a cheap lane
    allowed to be wrong."
  ogDescription: "One agent in several roles, sequenced by what just happened —
    and a cheap lane allowed to be wrong."
  canonical: "/concepts/multi-agent-orchestration/"

slug: "multi-agent-orchestration"
order: 2
title: "Multi-agent orchestration"
tags:
