tryIt:
  - command: "conductor journey"
    note: "Every session of a run with its kind and its model in a column. If a plan
      meant to use a smaller model somewhere and the column reads default, it
      never happened — and that is silent everywhere else."
  - command: "conductor money"
    note: "The same run split by ledger category. The gap between the delivering
      lane and everything beside it is the whole argument of this page, in the
      one place it can be checked."

