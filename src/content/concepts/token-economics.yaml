tryIt:
  - command: "conductor budget"
    note: "Prescribes a ceiling and a wrap-up ratio from your own store, and names
      the failures it found rather than only printing numbers."
  - command: "conductor money"
    note: "The same store from the accounting side: what was spent, by category, and
      what each unit of delivered work cost."

