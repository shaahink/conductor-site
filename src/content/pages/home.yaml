# A section the owner can turn off from the editor. `visible` is absent here on
# purpose: absent means shown, and that is the point of the default — the
# switch writes the field the first time it is used, and content files that
# predate the feature keep working untouched.
notes:
  title: "How to read this"
  body: "No figure here was typed by hand. A page names an evidence key; the value
    comes from a corpus recomputed from Conductor's own run store, and a page
    citing a key the corpus does not have fails the build. The failures are
    published beside the wins, because the waste and the abandoned runs are part
    of what a run costs."
