scenario: "A four-site web fleet, one shared component library, one round of
  coordinated changes"
standfirst: "The shape of the work, not the client. A change that has to land in
  the same way on several sites at once is the case where an orchestrator earns
  its keep, and the case where a half-applied change is worst."

